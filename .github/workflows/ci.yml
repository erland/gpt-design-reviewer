name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema pytest
      - name: Lint project
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Validate 1.5 domain contracts (retained)
        run: python scripts/validate_gpt_builder_1_5_contract.py
      - name: Run structural evals
        run: python scripts/run_evals.py --project-root .
      - name: Source hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final
      - name: Build five distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - name: Smoke-test packaged skill scripts
        run: python scripts/test_packaged_skill_scripts.py --project-root .
      - name: Verify modular skills in built distributions
        run: python scripts/test_modular_skills.py --project-root . --version 0.0.0-ci
      - name: Verify modular Skill separation
        run: python scripts/test_skill_separation.py --project-root . --version 0.0.0-ci
      - name: Validate distribution packages
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify exact five assets and checksums
        run: python scripts/verify_modern_release.py --version 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: design-reviewer-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
