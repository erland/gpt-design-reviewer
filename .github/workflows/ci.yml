name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema
      - name: Lint project
        run: python scripts/lint_gpt_project.py --project-root .

      - name: Validate GPT Builder 1.5 canonical contract
        run: python scripts/validate_gpt_builder_1_5_contract.py

      - name: Validate GPT Builder 1.5 runtime registry
        run: python scripts/validate_runtime_distribution_registry.py
      - name: Run structural evals
        run: python scripts/run_evals.py --project-root .
      - name: Check source-tree hygiene before build
        run: python scripts/project_hygiene.py --project-root . --mode final
      - name: Build all distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Validate GPT Builder 1.5 Chat distribution
        run: python scripts/validate_chat_gpt_builder_1_5.py --artifact dist/design-reviewer-chat-0.0.0-ci.zip

      - name: Validate GPT Builder 1.5 Custom GPT distribution
        run: python scripts/validate_custom_gpt_builder_1_5.py --artifact dist/design-reviewer-custom-gpt-0.0.0-ci.zip
      - name: Check runtime parity
        run: python scripts/check_runtime_parity.py --project-root .
      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: design-reviewer-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
