name: Build release distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Lint project
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Run structural evals
        run: python scripts/run_evals.py --project-root .
      - name: Check source-tree hygiene before build
        run: python scripts/project_hygiene.py --project-root . --mode final
      - name: Build all release distributions
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Validate GPT Builder 1.5 release runtime artifacts
        run: python scripts/validate_runtime_artifacts_1_5.py --version "${{ steps.version.outputs.version }}" --dir dist

      - name: Validate exact release asset set
        run: python scripts/validate_release_assets_1_5.py --version "${{ steps.version.outputs.version }}" --dir dist
      - name: Check runtime parity
        run: python scripts/check_runtime_parity.py --project-root .
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(python scripts/validate_release_assets_1_5.py --version "${{ steps.version.outputs.version }}" --dir dist --print-paths)
          gh release upload "${{ github.event.release.tag_name }}" "${assets[@]}" --clobber
