name: Build release distributions
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema pytest
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate optional companion evidence policy offline
        run: python -m unittest discover -s tests -p "test_optional_companion_evidence_policy.py" -v
      - name: Lint, evals, hygiene
        run: |
          python scripts/lint_gpt_project.py --project-root .
          python scripts/validate_gpt_builder_1_5_contract.py
          python scripts/run_evals.py --project-root .
          python scripts/project_hygiene.py --project-root . --mode final
      - name: Build five release distributions
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Smoke-test packaged skill scripts
        run: python scripts/test_packaged_skill_scripts.py --project-root .
      - name: Verify modular skills in release distributions
        run: python scripts/test_modular_skills.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Verify modular Skill separation
        run: python scripts/test_skill_separation.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Verify per-Skill resource ownership
        run: python scripts/test_skill_resource_ownership.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Execute packaged Plugin analyzer and verify Skill versions
        run: python scripts/test_plugin_zip_execution.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Verify Engine ZIP and run its original selftest
        run: python scripts/test_engine_distribution.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Validate packages and release assets
        run: |
          python scripts/validate_distributions.py --project-root .
          python scripts/verify_modern_release.py --version "${{ steps.version.outputs.version }}"
      - name: Upload exact assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
